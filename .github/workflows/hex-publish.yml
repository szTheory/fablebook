name: hex-publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HEX_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hex-publish
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  MIX_ENV: dev

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: ref
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "::error::the checkout is not the commit $TAG names"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          mix-env: dev
          cache: 'false'
      - run: mix local.hex 2.6.0 --force
      - id: tag
        run: |
          v="$(mix run --no-start --no-compile -e 'IO.write(Mix.Project.config()[:version])')"
          test "$TAG" = "v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - env:
          MIX_ENV: test
        run: mix test --only release --only prod_guard
      - id: build
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          mix hex.build --output "fablebook-$V.tar"
          echo "sha256=$(sha256sum "fablebook-$V.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mix hex.build --unpack --output unpacked
      - run: bin/smoke_consumer --path unpacked
      - id: sbom
        uses: erlef/mix_sbom@96bb84f8e9e72361bfad4142d666dfa2c0838ac2 # v0.12.0
        with:
          only: prod
          classification: library
          include-system-dependencies: 'false'
          vulnerabilities: 'false'
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SBOM: ${{ steps.sbom.outputs.sbom-path }}
          V: ${{ steps.tag.outputs.version }}
        run: |
          cp "$SBOM" "fablebook-$V.cdx.json"
          gh release upload "$TAG" "fablebook-$V.cdx.json" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hex-production
    env:
      SHA256: ${{ needs.build.outputs.sha256 }}
      V: ${{ needs.build.outputs.version }}
    steps:
      - env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: test -n "$HEX_API_KEY"
      - id: hex
        run: |
          status="$(curl -sS -o release.json -w '%{http_code}' "https://hex.pm/api/packages/fablebook/releases/$V")"
          case "$status" in
            200)
              remote="$(jq -r .checksum release.json)"
              if [ "$remote" != "$SHA256" ]; then
                echo "::error::hex.pm has fablebook $V with checksum $remote, the build produced $SHA256"
                exit 1
              fi
              if [ "$(jq -r .has_docs release.json)" = "true" ]; then todo=none; else todo=docs; fi ;;
            404) todo=package ;;
            *) echo "::error::hex.pm answered HTTP $status for fablebook $V"; exit 1 ;;
          esac
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
      - if: steps.hex.outputs.todo != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - if: steps.hex.outputs.todo != 'none'
        uses: ./.github/actions/setup
        with:
          mix-env: dev
          cache: 'false'
      - if: steps.hex.outputs.todo != 'none'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          TODO: ${{ steps.hex.outputs.todo }}
        run: |
          mix local.hex 2.6.0 --force
          if [ "$TODO" = docs ]; then mix hex.publish docs --yes; else mix hex.publish --yes; fi

  smoke:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        lane: [latest, floor]
    env:
      V: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lane: ${{ matrix.lane }}
          mix-env: dev
          cache: 'false'
      - run: bin/smoke_consumer --hex "$V" --checksum "$SHA256"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
        run: |
          bin/ci_health --file-regression "smoke ($LANE)" \
            "Tag $TAG stays a draft. Revert with \`mix hex.publish --revert $V\` (24 h for a new package, 1 h after)."

  finalize:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
