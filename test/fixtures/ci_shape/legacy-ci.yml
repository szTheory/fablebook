name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EVENT_BEFORE: ${{ github.event.before }}

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mix ci

  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
      FABLEBOOK_FLOOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lane: floor
      - run: mix compile --warnings-as-errors
      - run: mix compile --no-optional-deps --warnings-as-errors --force
      - run: mix test --warnings-as-errors --include prod_guard

  dialyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mix-env: dev
      - id: plt-key
        run: |
          tools="$(sha256sum .tool-versions | cut -c1-16)"
          echo "key=plt-$RUNNER_OS-$RUNNER_ARCH-$tools-$(sha256sum mix.lock | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: plt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ steps.plt-key.outputs.key }}
      - run: mix dialyzer --plt
      - if: github.ref == 'refs/heads/main' && steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ steps.plt-key.outputs.key }}
      - run: mix dialyzer --format github

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mix-env: dev
      - run: mix local.hex 2.6.0 --force
      - run: |
          hex="$(mix hex.info | sed -n 's/^Hex: *//p')"
          test "$(printf '%s\n' 2.5.1 "$hex" | sort -V | head -n 1)" = 2.5.1
      - run: mix hex.audit
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: docker://ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        with:
          args: .github
        env:
          GH_TOKEN: ${{ github.token }}

  nightly:
    if: >-
      github.event.schedule == '17 3 * * *' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - if: startsWith(github.head_ref, 'release-please--')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          open="$(gh issue list --label quality-regression --state open --json number --jq length)"
          if [ "$open" -ne 0 ]; then
            echo "::error::$open open quality-regression issue(s) block the release on $HEAD_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mix-env: dev
      - run: bin/smoke_consumer --path .
      - if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/ci_health --file-regression nightly

  ci-gate:
    if: always()
    needs: [core, floor, dialyzer, security, nightly]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$NEEDS" | jq -e --arg ref "$HEAD_REF" 'to_entries | all(
            .value.result == "success" or
            (.key == "nightly" and .value.result == "skipped" and ($ref | startswith("release-please--") | not)))'

  ci-health:
    if: github.event.schedule == '23 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mix-env: test
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bin/ci_health
      - run: mix test test/contract/ci_shape_test.exs
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/ci_health --file-regression ci-health
